<!DOCTYPE html>
<html>
	<head>
		<title> Chat!</title>
		<link href="style.css" rel="stylesheet"/>
	</head>
	<body>
		<header>
			<h1>deltAchat</h1>
			<h1 class="title-clone">deltAchat</h1>
		</header>
		<div class="container">
			<div class="setup" id="setup-window">
				<div class="input-group">
					<label for="nickInput">Name</label>
					<input type="text" naem="nickInput" id="nickInput">
				</div>
				<div class="input-group">
					<label for="roomInput" >Room code</label>
					<div class="group">
						<input type="text" id="roomInput" name="roomInput" value="DUMBWorld" required>
						<div style="text-align: end;"><button id="randomizeBtn">Randomize</button></div>
					</div>
				</div>
					
				<div class="input-group">
					<label for="map">Map</label>
					<select name="map" id ="map">
						<option value="castletown" selected>Castletown</option>
						<option value="cafe">Cafe</option>
					</select>
				</div>
				<label for="character-grid">Avatar</label>
				<div style="display: flex; justify-content: center; gap: 5px; padding: 5px;">
					<div class="character-panel" name="character-grid">

						<div id="characterGrid" class="character-grid"></div>
						
						<div class="selectedChara">
							<div>
								<img id="portrait"
								src="portrait_pippins.png"
								style="image-rendering:crisp-edges;">

								<span id="characterName">Pippins</span>
							</div>
							<p class="charCredit">By: <span id="characterCredit"></span></p>
						</div>
						
					</div>
				</div>
				<details>
					<summary>Game options</summary>	
					<div>
						<label for="sound">Music volume</label>
						<input type="range" min="0" max="100" value="100" id="musicVolume-preGame">
					</div>
					<div>
						<label for="Volume">SFX volume</label>
						<input type="range" min="0" max="100" value="100" id="sfxVolume-preGame">
					</div>
					
				</details>
			<button id="confirm-nick-btn">Enter</button>
			<footer>CHARACTER GRID BY ELANGEL2006</footer>
			</div> 
			<div class="chat-container" id="chat-container" style="display:none;">
					<input type="radio" name="chatbutton" id="chatbutton-chat" checked>
					<label for="chatbutton-chat">Chat</label>

					<input type="radio" name="chatbutton" id="chatbutton-music">
					<label for="chatbutton-music">Music</label>
					
					<input type="radio" name="chatbutton" id="chatbutton-options">
					<label for="chatbutton-options">Options</label>
				
				<div class="window chat-window" id="chatBox">
				</div>
				<div class="chat-ui">
					<input type="text" id="textInput">
					<button id="sendButton">Send</button>
				</div>

				<div class="window music-window" id="musicBox">
					<div id="music-container">
						<p id="now-playing">Now playing: Castletown</p>
						<div class="button-container">
							<button id="previous-song">Previous</button>
							<button id="next-song">Next</button>
						</div>
					</div>
				</div>
				
				<div class="window options-window" id="optionsBox">
					<span>SFX vol:</span>
					<input type="range" min="0" max="100" value="100" id="sfxVolume">
				</div>

			</div>
			<div id="gameWindow" style="display:none; position: relative;" >
				<canvas id="canvas" width="640" height="454px">
					Canvas not supported :(
				</canvas>
				<p id="room-id">Room: DUMBWorld</p>
			</div>
			<div class="side-bar" id="side-bar" style="display: none;">
				<div id="online-peers">Currently online (<span id="online-number">1</span>):</div>
				<div id="online-list"></div>
				<hr>
				</div>
			</div>
		</div>
	</body>
	<script type="module" src="./js/loginScreen.js"></script>
<script type="module" src="./js/avatars.js"></script>
</html>
